# NXP MCX C / Kinetis KL — MCU-Link onboard probe (CMSIS-DAP) + kinetis flash driver
adapter driver cmsis-dap
transport select swd
adapter speed 1000
swd newdap chip cpu -enable
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
chip.cpu configure -work-area-phys 0x20000000 -work-area-size 0x400 -work-area-backup 0
flash bank chip.flash kinetis 0 0 0 0 chip.cpu
cortex_m reset_config sysresetreq

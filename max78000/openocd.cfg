# MAX78000 over CMSIS-DAP (the DAPLink on an FTHR/EVKIT board).
#
# OpenOCD ships no target config for this part, so the DAP and the flash bank
# are built by hand. The `max32xxx` driver is compiled into the OpenOCD
# UnityMbed bundles and programs it correctly — verified on a MAX78000FTHR:
# erase, write and verify_image over 512 KiB.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 2000

source [find target/swj-dp.tcl]
swj_newdap chip cpu -irlen 4 -ircapture 0x1 -irmask 0xf -ignore-version
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
chip.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0

# <base> <size> 0 0 <target> <FLC base> <sector> <clkdiv> <options>
flash bank chip.flash max32xxx 0x10000000 0x80000 0 0 chip.cpu 0x40029000 0x2000 100 0x01
